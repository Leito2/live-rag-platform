[project]
name = "ragcore"
version = "0.1.0"
description = "Shared chunking, IDs, contracts and SSE event names — identical at ingest and query time."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragcore"]
